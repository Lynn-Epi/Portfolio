<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contact Form</title>
    <link rel="stylesheet" href="contact.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Leckerli+One&family=Lobster&family=Yellowtail&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=League+Spartan:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <img class="headerLogo" src="./Pictures/L_logo.png" alt="logo" />

      <a class="contactButton red" href="index.html"> Back to Portfolio</a>
    </header>
    <h2>Lets get in touch.</h2>
    <p>send me a message</p>
    <main>
      <form
        class="contactForm"
        action="https://formspree.io/f/xoejopgg"
        method="POST"
      >
        <label class="formLabel" for="Name">Name:</label>
        <input type="text" name="name" required />
        <label class="formLabel" for="Email">Email:</label>
        <input type="email" name="email" required />
        <label class="formLabel" for="Message">Message:</label>
        <textarea name="message" rows="3" required></textarea>
      </form>
      <a href="index.html" class="contactButton mobileBack">
        Back to Portfolio
      </a>
    </main>
  </body>
</html>
